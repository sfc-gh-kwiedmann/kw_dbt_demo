version: 2

models:
  - name: products_summary
    description: One row per price tier with aggregate metrics (count and average price)
    columns:
      - name: price_tier
        description: The tier grouping key — must contain exactly 3 rows
        tests:
          - unique
          - not_null
          - accepted_values:
              values: ['premium', 'standard', 'budget']
      - name: product_count
        description: Total number of products in this tier, must be at least 1
        tests:
          - not_null
      - name: avg_price
        description: Mean price within the tier, must be positive
        tests:
          - not_null

  - name: top_10_products_by_price
    description: The 10 highest-priced products, ordered by price descending
    columns:
      - name: id
        description: Product identifier, unique within this result set
        tests:
          - unique
          - not_null
      - name: product
        description: Product name
        tests:
          - not_null
      - name: price
        description: Product price — all rows should be among the most expensive
        tests:
          - not_null
      - name: price_tier
        description: Expected to be mostly premium or standard given high prices
        tests:
          - not_null
          - accepted_values:
              values: ['premium', 'standard', 'budget']
