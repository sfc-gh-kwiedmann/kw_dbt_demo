version: 2

models:
  - name: products_enriched
    description: Products enriched with a price tier derived from the raw price value
    columns:
      - name: id
        description: Unique product identifier from the source Iceberg table
        tests:
          - unique
          - not_null
      - name: product
        description: Human-readable product name
        tests:
          - not_null
      - name: price
        description: Product price in base currency, must be a positive value
        tests:
          - not_null
      - name: price_tier
        description: >
          Derived classification based on price thresholds:
          premium (>50), standard (>20), budget (<=20)
        tests:
          - not_null
          - accepted_values:
              values: ['premium', 'standard', 'budget']
              config:
                severity: error
